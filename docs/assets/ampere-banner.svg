<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">AMPERE — infrastructure flight recorder</title>
  <desc id="desc">A terminal-style diagram: Arkiv and frame transaction RPC feed a bounded recorder, which produces canonical JSON and signed evidence.</desc>
  <rect width="1200" height="350" rx="10" fill="#111719"/>
  <rect x="1" y="1" width="1198" height="348" rx="9" fill="none" stroke="#34423b"/>
  <path d="M0 44H1200M48 274H1152" stroke="#34423b"/>
  <g fill="#718078"><circle cx="26" cy="23" r="4"/><circle cx="42" cy="23" r="4"/><circle cx="58" cy="23" r="4"/></g>
  <g font-family="Consolas,Monaco,monospace">
    <text x="92" y="28" font-size="12" fill="#a5b6ab">ampere / recorder.ts</text>
    <text x="1150" y="28" font-size="11" text-anchor="end" fill="#a5b6ab">local-first infrastructure tooling</text>
    <text x="48" y="134" font-size="68" letter-spacing="-4" fill="#e0eae2">AMPERE<tspan fill="#b8d0be">_</tspan></text>
    <text x="51" y="169" font-size="18" fill="#b4c7b9">A flight recorder for blockchain infrastructure.</text>
    <text x="51" y="213" font-size="13" fill="#92aa9b">rpc.call → measure → compare → sign → verify</text>
    <g transform="translate(760 82)">
      <path d="M0 12H30V63H61M0 114H30V63" fill="none" stroke="#5c7a65" stroke-width="2"/>
      <rect x="61" y="34" width="275" height="58" rx="3" fill="#1e2c23" stroke="#587563"/>
      <text x="81" y="58" font-size="13" fill="#d9e9dd">record(request)</text>
      <text x="81" y="78" font-size="11" fill="#a7bfae">bounded · redacted · inspectable</text>
      <text x="0" y="-3" font-size="11" fill="#adbecd">Arkiv RPC</text>
      <text x="0" y="139" font-size="11" fill="#adbecd">EIP-8141 sidecar</text>
      <path d="M198 92V124" stroke="#5c7a65" stroke-width="2"/>
      <text x="107" y="145" font-size="12" fill="#b8d0be">sha256 + ed25519</text>
    </g>
    <text x="48" y="313" font-size="12" fill="#adbecd">[01] node telemetry</text>
    <text x="345" y="313" font-size="12" fill="#adbecd">[02] admission evidence</text>
    <text x="690" y="313" font-size="12" fill="#adbecd">[03] verifiable reports</text>
    <text x="1152" y="313" text-anchor="end" font-size="12" fill="#b8d0be">MIT / v0.1</text>
  </g>
</svg>
